# Production: nginx static frontend (same-origin /api -> api service).
services:
  api:
    build: .
    env_file: .env
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
